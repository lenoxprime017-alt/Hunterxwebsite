# Panel de administración (Decap CMS) — https://decapcms.org/docs/
#
# Cómo funciona: al guardar, el panel actualiza los archivos de
# client/content/*.json en GitHub y Netlify vuelve a publicar la página
# sola (1-2 minutos). No hay base de datos.
#
# Seguridad: el inicio de sesión lo hace GitHub. Solo las cuentas con
# permiso de escritura en el repositorio pueden guardar cambios.

backend:
  name: github
  repo: lenoxprime017-alt/Hunterxwebsite
  branch: main
  base_url: https://api.netlify.com
  site_domain: linktreehunterx.netlify.app
  commit_messages:
    create: "Panel: crea {{collection}} «{{slug}}»"
    update: "Panel: actualiza {{collection}} «{{slug}}»"
    delete: "Panel: elimina {{collection}} «{{slug}}»"
    uploadMedia: "Panel: sube archivo «{{path}}»"
    deleteMedia: "Panel: elimina archivo «{{path}}»"

# Solo se usa en tu PC (localhost) con `npm run cms`: permite probar el
# panel sin iniciar sesión. En la página publicada se ignora.
local_backend: true

locale: es
site_url: https://linktreehunterx.netlify.app
display_url: https://linktreehunterx.netlify.app
logo_url: /apple-touch-icon.png?v=2

# Archivos que se suban desde el panel (portadas, canciones, videos, íconos)
media_folder: public/uploads
public_folder: /uploads

editor:
  preview: false

collections:
  - name: contenido
    label: Contenido de la página
    label_singular: Sección
    description: Todo lo que se ve en la página. Al guardar, la página se actualiza en 1-2 minutos.
    editor:
      preview: false
    format: json
    files:
      # ------------------------------------------------------------------
      - name: hero
        label: "🎵 Portada principal (lo primero que se ve)"
        file: client/content/hero.json
        fields:
          - label: ¿Qué se muestra?
            name: mode
            widget: select
            default: audio
            options:
              - { label: "Canción con su portada (con reproductor)", value: audio }
              - { label: "Video", value: video }
            hint: Con "Canción" se ve la portada y suena la canción. Con "Video" se reproduce el video en lugar de la portada.
          - label: Etiqueta
            name: badge
            widget: string
            default: Nuevo sencillo
            hint: "Texto pequeño arriba del nombre. Ej: Nuevo sencillo, Ya disponible."
          - label: Nombre de la canción
            name: title
            widget: string
          - label: Productor / créditos
            name: producer
            widget: string
            required: false
            hint: "Ej: Prod. Latrenzha"
          - label: Portada
            name: cover
            widget: image
            choose_url: false
            hint: Imagen cuadrada (ideal 1080×1080, JPG). Se usa también de fondo y en el reproductor.
          - label: Canción (MP3)
            name: audio
            widget: file
            choose_url: false
            required: false
            hint: Solo para el modo "Canción". Archivo MP3 de menos de 10 MB.
          - label: Segundos que suena en bucle
            name: previewSeconds
            widget: number
            value_type: int
            min: 10
            max: 600
            default: 59
            hint: La canción vuelve a empezar al llegar a este segundo.
          - label: Video (MP4)
            name: video
            widget: file
            choose_url: false
            required: false
            hint: Solo para el modo "Video". MP4 comprimido de menos de 25 MB (los archivos grandes pueden fallar al subir).
          - label: Link del botón "Ver en YouTube"
            name: youtubeUrl
            widget: string
            pattern: ['^https://(www\.|m\.|music\.)?(youtube\.com|youtu\.be)/.+', "Debe ser un link de YouTube que empiece con https://"]

      # ------------------------------------------------------------------
      - name: videos
        label: "▶️ Videos de YouTube"
        file: client/content/videos.json
        fields:
          - label: Videos
            name: videos
            widget: list
            label_singular: video
            summary: "{{fields.title}} · {{fields.kind}}"
            min: 1
            max: 12
            hint: El primero de la lista es el destacado. Arrastra para cambiar el orden.
            fields:
              - label: Link del video
                name: url
                widget: string
                hint: "Copia el link desde YouTube (Compartir → Copiar). Ej: https://www.youtube.com/watch?v=… o https://youtu.be/…"
                pattern: ['^https://(www\.|m\.|music\.)?(youtube\.com/(watch\?.*v=|shorts/|live/)|youtu\.be/)[\w-]{11}', "Pega un link de video de YouTube válido"]
              - label: Nombre de la canción
                name: title
                widget: string
              - label: Artistas
                name: artists
                widget: string
                default: HUNTERX
                hint: "Ej: HUNTERX ft. Julia Javier"
              - label: Tipo
                name: kind
                widget: select
                default: Video Oficial
                options: [Video Oficial, Audio Oficial, Visualizer, Lyric Video, En Vivo, Detrás de Cámaras]

      # ------------------------------------------------------------------
      - name: instagram
        label: "📸 Publicaciones de Instagram"
        file: client/content/instagram.json
        fields:
          - label: Publicaciones
            name: posts
            widget: list
            label_singular: publicación
            summary: "{{fields.url}}"
            min: 1
            max: 12
            hint: Se muestran en el carrusel en este orden.
            fields:
              - label: Link de la publicación
                name: url
                widget: string
                hint: "En Instagram: ••• → Copiar enlace. Ej: https://www.instagram.com/p/…"
                pattern: ['^https://(www\.)?instagram\.com/([\w.]+/)?(p|reel|reels|tv)/[\w-]{5,40}', "Pega un link de publicación de Instagram válido"]
              - label: Imagen de la publicación
                name: image
                widget: image
                choose_url: false
                required: false
                hint: Sube una captura o la imagen del post (vertical, ideal 1080×1350). Si la dejas vacía se usa la descargada con `npm run instagram`; si no hay ninguna, se muestra una tarjeta con el logo de Instagram.
              - label: Usuario que publicó
                name: username
                widget: string
                required: false
                hint: "Sin @. Déjalo vacío si es hunterxoficial."
              - label: Tipo
                name: type
                widget: select
                required: false
                options:
                  - { label: Reel, value: reel }
                  - { label: Carrusel, value: carousel }
                  - { label: Foto, value: photo }

      # ------------------------------------------------------------------
      - name: platforms
        label: "🎧 Plataformas de música y redes"
        file: client/content/platforms.json
        fields:
          - label: Plataformas
            name: platforms
            widget: list
            label_singular: plataforma
            summary: "{{fields.name}}"
            max: 20
            fields:
              - { label: Nombre, name: name, widget: string }
              - { label: Descripción, name: description, widget: string, hint: "Ej: Escucha mi música completa" }
              - label: Link
                name: url
                widget: string
                pattern: ['^https://.+', "El link debe empezar con https://"]
              - { label: Ícono, name: icon, widget: image, choose_url: false, hint: "PNG cuadrado con fondo transparente (192×192)" }
              - { label: Color de la marca, name: color, widget: color, default: "#fbbf24", hint: Se usa para el brillo al pasar el cursor. }

      # ------------------------------------------------------------------
      - name: artist
        label: "👤 Datos del artista y textos"
        file: client/content/artist.json
        fields:
          - { label: Nombre artístico, name: name, widget: string }
          - { label: Frase corta, name: tagline, widget: string, hint: "Ej: Música Urbana Cristiana" }
          - { label: Descripción (hero), name: bio, widget: text }
          - { label: Texto del pie de página, name: footerText, widget: string }
          - { label: Usuario de Instagram, name: instagramHandle, widget: string, hint: "Ej: @hunterxoficial" }
          - label: Link de Instagram
            name: instagramUrl
            widget: string
            pattern: ['^https://(www\.)?instagram\.com/.+', "Debe ser un link de Instagram"]
          - label: Link del canal de YouTube
            name: youtubeUrl
            widget: string
            pattern: ['^https://(www\.)?youtube\.com/.+', "Debe ser un link de YouTube"]
          - label: Link de Spotify
            name: spotifyUrl
            widget: string
            pattern: ['^https://open\.spotify\.com/.+', "Debe ser un link de Spotify"]
          - label: Dirección de la página
            name: siteUrl
            widget: string
            hint: Se usa en el botón Compartir.
            pattern: ['^https://.+', "Debe empezar con https://"]
          - { label: Mensaje al compartir, name: shareText, widget: string }
